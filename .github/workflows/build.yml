name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "UNV-Kamery-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: UNV-Kamery-apk
          path: UNV-Kamery-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: UNV Камеры 1.0.${{ github.run_number }}
          body: |
            Скачайте файл **UNV-Kamery-1.0.${{ github.run_number }}.apk** ниже и установите на телефон.
            Новые версии ставятся поверх старой — камеры и записи сохраняются.
          files: UNV-Kamery-*.apk
          make_latest: true
